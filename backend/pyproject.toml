[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersecra-x-backend"
version = "0.1.0"
description = "Evidence-aware cybersecurity research intelligence API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["app", "tests"]
extraPaths = ["."]
venvPath = ".."
venv = ".venv"

