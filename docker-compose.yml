services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      PYTHONPATH: /workspace/backend:/workspace
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: ${DOCKER_DATABASE_URL:-sqlite:////workspace/data/cybersecra.db}
      DATA_DIR: /workspace/data
      JWT_SECRET: ${JWT_SECRET:?Run python3 scripts/product.py configure first}
      REDIS_URL: ${DOCKER_REDIS_URL:-}
      NEO4J_URI: ${DOCKER_NEO4J_URI:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./data:/workspace/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  refresh-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["python", "scripts/refresh_worker.py", "--interval", "86400"]
    environment:
      DATA_DIR: /workspace/data
    volumes:
      - ./data:/workspace/data
    restart: unless-stopped

  # Optional infrastructure profile. The backend probes these services and
  # reports a per-service degraded state when they are unavailable; it does not
  # claim connectivity merely because a URL is configured.
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["infra"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybersecra}
      POSTGRES_USER: ${POSTGRES_USER:-cybersecra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/product.py configure first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    profiles: ["infra"]
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Run python3 scripts/product.py configure first}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_AUTH%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
