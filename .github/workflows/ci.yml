name: cybersecra-x-ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cybersecra_test
          POSTGRES_USER: cybersecra
          POSTGRES_PASSWORD: integration-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cybersecra -d cybersecra_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/integration-test-only
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p integration-test-only 'RETURN 1'"
          --health-interval 20s --health-timeout 10s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://cybersecra:integration-test-only@127.0.0.1:5432/cybersecra_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      TEST_NEO4J_URI: bolt://127.0.0.1:7687
      TEST_NEO4J_PASSWORD: integration-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q backend
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m pip install -r backend/requirements.txt python-docx reportlab Pillow pytesseract
      - run: PYTHONPATH=backend python scripts/bootstrap_data.py --evaluation
      - run: PYTHONPATH=backend python -m pytest -q backend/tests
      - run: PYTHONPATH=backend python scripts/evaluation/evaluate_cybertrust.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run build --prefix frontend
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze --no-fatal-infos
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/product.py configure
      - run: docker compose config
